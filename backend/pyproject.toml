[project]
name = "binance-agent-os-backend"
version = "0.1.0"
description = "AI-powered Binance Market Intelligence Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.21.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.3.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.19.1",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "pydantic-ai-slim[openrouter]>=2.37.0",
    "binance-sdk-sub-account>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "openai>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
